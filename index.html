<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلدية مسقط</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 15px; text-align: right; direction: rtl; }
        .box { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto; }
        h2 { color: #0c3352; border-bottom: 2px solid #cca133; padding-bottom: 8px; font-size: 18px; text-align: center; }
        label { font-size: 13px; font-weight: bold; display: block; margin: 10px 0 5px 0; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        .btn { background: #0c3352; color: white; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 4px; margin-top: 20px; cursor: pointer; font-size: 15px; border-bottom: 3px solid #051d30; }
    </style>
</head>
<body>
<div class="box">
    <div style="text-align:center;"><img src="./logo.png" style="max-width:100px;height:auto;"><h2 style="margin-top:10px;">استمارة عقد إيجار - بلدية مسقط</h2></div>
    
    <label>اسم المؤجر (المالك) *</label>
    <input type="text" id="ownerName" placeholder="أدخل الاسم الكامل">
    
    <label>الرقم المدني للمؤجر *</label>
    <input type="text" id="ownerId" placeholder="أدخل الرقم المدني">
    
    <label>رقم الهاتف النقال *</label>
    <input type="text" id="ownerPhone" placeholder="9xxxxxxx">

    <label>اسم المستأجر *</label>
    <input type="text" id="tenantName" placeholder="أدخل اسم المستأجر">

    <label>رقم المبنى *</label>
    <input type="text" id="buildingNo" placeholder="رقم المبنى">

    <label>القيمة الإيجارية شهرياً *</label>
    <input type="text" id="rentalValue" placeholder="مثال: 150">

    <button class="btn" type="button" onclick="startPDFGeneration()">حفظ البيانات وتنزيل الـ PDF المباشر</button>
</div>
<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>
<script src="script.js"></script>
</body>
</html>
