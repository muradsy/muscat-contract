<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلدية مسقط - استمارة عقد إيجار جديد</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; direction: rtl; }
        .wrapper { max-width: 100%; margin: 0 auto; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .main-header { text-align: center; padding: 20px; border-bottom: 3px solid #cca133; background: #fff; }
        .main-header img { max-width: 100px; height: auto; }
        .main-header h1 { color: #0c3352; font-size: 20px; margin: 10px 0 5px 0; font-weight: bold; }
        .page-title { background: #0c3352; color: #fff; text-align: center; padding: 8px; font-size: 16px; font-weight: bold; }
        .section-box { margin: 15px; border: 1px solid #e1e4e8; border-radius: 4px; overflow: hidden; background: #fff; }
        .section-header { background: #f8f9fa; color: #0c3352; padding: 10px 15px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #e1e4e8; border-right: 4px solid #cca133; }
        .section-body { padding: 15px; display: grid; grid-template-columns: 1fr; gap: 12px; }
        .form-control { display: flex; flex-direction: column; }
        .form-control label { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .form-control label span { color: red; }
        .form-control input, .form-control select, .form-control textarea { width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; background-color: #fff; color: #333; }
        .form-control input:focus, .form-control select:focus { border-color: #0c3352; outline: none; }
        .checkbox-row { display: flex; align-items: center; gap: 10px; padding: 5px 15px; font-size: 13px; font-weight: bold; color: #333; }
        .checkbox-row input { width: 18px; height: 18px; cursor: pointer; }
        .table-container { margin: 15px; overflow-x: auto; border: 1px solid #e1e4e8; border-radius: 4px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        .data-table th { background: #0c3352; color: #fff; padding: 10px; font-weight: bold; border: 1px solid #e1e4e8; }
        .data-table td { padding: 8px; border: 1px solid #e1e4e8; }
        .data-table input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center; }
        .footer-action { padding: 20px 15px; background: #f8f9fa; border-top: 1px solid #e1e4e8; text-align: center; }
        .btn-submit { background-color: #0c3352; color: #fff; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; max-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-bottom: 3px solid #061f33; }
        .btn-submit:hover { background-color: #061f33; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="main-header">
        <!-- تم ربط الشعار الأصلي لبلدية مسقط مباشرة من خادم موثوق ليظهر على الموبايل -->
        <img src="https://mm.gov.om" alt="شعار بلدية مسقط">
        <h1>بلدية مسقط</h1>
    </div>
    
    <div class="page-title">استمارة عقد إيجار جديد</div>

    <!-- بيانات المؤجر -->
    <div class="section-box">
        <div class="section-header">بيانات المؤجر</div>
        <div class="section-body">
            <div class="form-control"><label>تعريف المؤجر <span>*</span></label><select id="landlordType"><option>الرقم المدني</option><option>السجل التجاري</option></select></div>
            <div class="form-control"><label>الرقم التعريفي للمؤجر (الرقم المدني ، السجل التجاري) <span>*</span></label><input type="text" id="ownerId" placeholder="أدخل الرقم التعريفي"></div>
            <div class="form-control"><label>علاقة المؤجر <span>*</span></label><select id="ownerRelation"><option>نفس المالك</option><option>وكيل</option></select></div>
            <div class="form-control"><label>اسم المؤجر <span>*</span></label><input type="text" id="ownerName" placeholder="أدخل اسم المؤجر كاملاً"></div>
            <div class="form-control"><label>رقم الهاتف النقال <span>*</span></label><input type="text" id="ownerPhone" placeholder="9xxxxxxx"></div>
            <div class="form-control"><label>صندوق بريد</label><input type="text" id="ownerBox"></div>
            <div class="form-control"><label>الرمز البريدي</label><input type="text" id="ownerPostCode"></div>
            <div class="form-control"><label>العنوان</label><input type="text" id="ownerAddress"></div>
            <div class="form-control"><label>البريد الإلكتروني</label><input type="email" id="ownerEmail" placeholder="username@example.com"></div>
        </div>
    </div>

    <!-- بيانات المالك -->
    <div class="section-box">
        <div class="section-header">بيانات المالك (في حالة اختلاف بيانات مالك العقار عن مالك الوحدات)</div>
        <div class="checkbox-row">
            <input type="checkbox" id="sameAsOwner" checked>
            <label>هل مالك الوحدة (المؤجر بالعقد) هو نفس مالك البناية؟</label>
        </div>
    </div>

    <!-- بيانات العقار -->
    <div class="section-box">
        <div class="section-header">بيانات العقار</div>
        <div class="section-body">
            <div class="form-control"><label>الغرض من العقد <span>*</span></label><select id="contractUsage"><option>سكني</option><option>تجاري</option><option>صناعي</option></select></div>
            <div class="form-control"><label>نوع إستعمال السكني <span>*</span></label><select id="residentialType"><option>سكن عائلي</option><option>عزاب</option></select></div>
            <div class="form-control"><label>رقم المبنى <span>*</span></label><input type="text" id="buildingNo"></div>
            <div class="form-control"><label>رقم السكة</label><input type="text" id="wayNo"></div>
            <div class="form-control"><label>رقم الشارع</label><input type="text" id="streetName"></div>
            <div class="form-control"><label>رقم المجمع <span>*</span></label><input type="text" id="blockNo"></div>
            <div class="form-control"><label>المنطقة <span>*</span></label><input type="text" id="areaZone" placeholder="مثال: بلدية مسقط في السيب - المعبيلة الجنوبية"></div>
            <div class="form-control"><label>اسم المربع (طبقاً للملكية)</label><input type="text" id="blockMulkia"></div>
            <div class="form-control"><label>رقم القطعة <span>*</span></label><input type="text" id="plotNo"></div>
            <div class="form-control"><label>رقم الكروكي (طبقاً للملكية) <span>*</span></label><input type="text" id="krookieNo"></div>
            <div class="form-control"><label>رقم حساب الكهرباء للعقار <span>*</span></label><input type="text" id="electricityNo"></div>
            <div class="form-control"><label>رقم حساب المياه للعقار</label><input type="text" id="waterNo"></div>
        </div>
        <div class="checkbox-row"><input type="checkbox" id="subContract"><label>عقد من الباطن</label></div>
        <div class="checkbox-row"><input type="checkbox" id="fullBuilding" checked><label>تأجير كلي للمبنى</label></div>
    </div>

    <!-- بيانات الوحدات -->
    <div class="section-box">
        <div class="section-header">بيانات الوحدات</div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>نوع الوحدة</th>
                        <th>رقم الوحدة</th>
                        <th>القيمة الإيجارية</th>
                        <th>رقم حساب الكهرباء</th>
                        <th>رقم حساب المياه</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" id="unitType" value="تأجير كامل البناية"></td>
                        <td><input type="text" id="unitNo" value="0"></td>
                        <td><input type="text" id="unitPrice" placeholder="القيمة"></td>
                        <td><input type="text" id="unitElec" placeholder="الكهرباء"></td>
                        <td><input type="text" id="unitWater" placeholder="المياه"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- بيانات المستأجر -->
    <div class="section-box">
        <div class="section-header">بيانات المستأجر</div>
        <div class="section-body">
            <div class="form-control"><label>تعريف المستأجر <span>*</span></label><select id="tenantType"><option>الرقم المدني</option><option>جواز السفر</option></select></div>
            <div class="form-control"><label>الرقم التعريفي للمستأجر <span>*</span></label><input type="text" id="tenantId"></div>
            <div class="form-control"><label>اسم المستأجر <span>*</span></label><input type="text" id="tenantName"></div>
            <div class="form-control"><label>رقم الهاتف النقال <span>*</span></label><input type="text" id="tenantPhone"></div>
            <div class="form-control"><label>صندوق بريد</label><input type="text" id="tenantBox"></div>
            <div class="form-control"><label>الرمز البريدي</label><input type="text" id="tenantPostCode"></div>
            <div class="form-control"><label>العنوان</label><input type="text" id="tenantAddress"></div>
            <div class="form-control"><label>البريد الإلكتروني</label><input type="email" id="tenantEmail"></div>
        </div>
    </div>

    <!-- تفاصيل العقد -->
    <div class="section-box">
        <div class="section-header">تفاصيل العقد</div>
        <div class="section-body">
            <div class="form-control"><label>تاريخ بداية العقد <span>*</span></label><input type="date" id="fromDate"></div>
            <div class="form-control"><label>تاريخ نهاية العقد <span>*</span></label><input type="date" id="toDate"></div>
